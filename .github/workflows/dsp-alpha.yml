name: DSP Alpha build and test

on:
  push:
    branches:
      - develop/v2-neural-engine
    paths:
      - '.github/workflows/dsp-alpha.yml'
      - 'Source/**'
      - 'Tests/**'
      - 'cmake/**'
      - 'windows/**'

permissions:
  contents: read

concurrency:
  group: dsp-alpha-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows-x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the 1.1.0 reference
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/panner-legacy" 3cc948da50ad7abcc44b7d66bf2168bb518113af

      - name: Compile Windows VST3 and DSP tests
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"
          cmake -S windows -B build-alpha -G "Visual Studio 18 2026" -A x64 `
            "-DGETT1_JUCE_PATH=$env:RUNNER_TEMP/JUCE" `
            "-DGETT1_LEGACY_SOURCE_DIR=$env:RUNNER_TEMP/panner-legacy" -DGETT1_BUILD_DSP_TESTS=ON
          cmake --build build-alpha --config Release --parallel 2 --target GettoneSpacePanner_VST3 PannerDspTests

      - name: Run processor regressions
        id: regression
        run: ctest --test-dir build-alpha -C Release --output-on-failure

      - name: Validate Windows VST3
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          Expand-Archive "$env:RUNNER_TEMP/pluginval.zip" "$env:RUNNER_TEMP/pluginval"
          $validator = (Get-ChildItem "$env:RUNNER_TEMP/pluginval" -Filter "pluginval.exe" -Recurse | Select-Object -First 1).FullName
          & $validator --strictness-level 5 --skip-gui-tests --validate "build-alpha/GettoneSpacePanner_artefacts/Release/VST3/Skeuomorphic Space Panner 2.1.1 Alpha.vst3"

      - name: Archive test bundles with permissions
        id: archive
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/panner-alpha"
          mkdir -p "$stage"
          cp LICENSE "$stage/"
          cp windows/Assets/OFL.txt "$stage/PixelifySans-OFL.txt"
          mkdir -p "$stage/VST3"
          cp -R "build-alpha/GettoneSpacePanner_artefacts/Release/VST3/Skeuomorphic Space Panner 2.1.1 Alpha.vst3" "$stage/VST3/"
          tar -czf Skeuomorphic_Space_Panner_2.1.1_Alpha_Windows-x64.tar.gz -C "$stage" .
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        with:
          name: Skeuomorphic-Space-Panner-2.1.1-Alpha-Windows-x64
          path: Skeuomorphic_Space_Panner_2.1.1_Alpha_Windows-x64.tar.gz
          if-no-files-found: error
